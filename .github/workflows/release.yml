name: Release

# Empujar una etiqueta vX.Y.Z ejecuta los tests, compila el APK y lo adjunta a la release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Comprobar que la etiqueta coincide con la versión de la app
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$version" != "$declared" ]; then
            echo "::error::La etiqueta es $GITHUB_REF_NAME pero app/build.gradle.kts declara versionName \"$declared\"."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Preparar la firma
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto SIGNING_KEYSTORE_BASE64. El APK se firma con una clave de depuración efímera y no se instalará encima de versiones anteriores."
          fi

      - name: Tests y APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug

      - name: Publicar el APK en la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="ClimbTracker-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Un APK ya publicado no se sustituye nunca: quien lo descargó debe poder fiarse de él.
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$apk"; then
              echo "::notice::La release $GITHUB_REF_NAME ya tiene $apk; no se sobrescribe."
            else
              gh release upload "$GITHUB_REF_NAME" "$apk"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "Climb Tracker ${VERSION}" --generate-notes
          fi
